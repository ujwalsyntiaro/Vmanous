<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1A"/>
      <stop offset="50%" stop-color="#051824"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#040D1A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16, 185, 129, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1440" height="600" fill="url(#bgGrad)"/>
  <rect width="1440" height="600" fill="url(#grid)"/>

  <!-- Emerald Glow Spheres -->
  <circle cx="720" cy="250" r="350" fill="url(#greenGlow)"/>
  <circle cx="200" cy="150" r="200" fill="url(#greenGlow)"/>
  <circle cx="1200" cy="400" r="250" fill="url(#greenGlow)"/>

  <!-- AI Neural Lines (Green & White) -->
  <g stroke-linecap="round" opacity="0.6">
    <line x1="150" y1="120" x2="350" y2="200" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="350" y1="200" x2="500" y2="150" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="500" y1="150" x2="720" y2="280" stroke="#34D399" stroke-width="2"/>
    <line x1="720" y1="280" x2="950" y2="180" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="950" y1="180" x2="1150" y2="240" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1150" y1="240" x2="1320" y2="150" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <line x1="250" y1="420" x2="450" y2="350" stroke="#34D399" stroke-width="1"/>
    <line x1="450" y1="350" x2="720" y2="280" stroke="#10B981" stroke-width="2"/>
    <line x1="720" y1="280" x2="1000" y2="380" stroke="#34D399" stroke-width="1.5"/>
    <line x1="1000" y1="380" x2="1250" y2="450" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  </g>

  <!-- Glowing Nodes (White & Green) -->
  <g>
    <!-- White Nodes -->
    <circle cx="500" cy="150" r="5" fill="#FFFFFF" filter="drop-shadow(0 0 6px #FFFFFF)"/>
    <circle cx="950" cy="180" r="5" fill="#FFFFFF" filter="drop-shadow(0 0 6px #FFFFFF)"/>
    <circle cx="450" cy="350" r="4" fill="#FFFFFF"/>
    
    <!-- Green Nodes -->
    <circle cx="720" cy="280" r="10" fill="#10B981" filter="drop-shadow(0 0 15px #10B981)"/>
    <circle cx="720" cy="280" r="4" fill="#FFFFFF"/>
    
    <circle cx="350" cy="200" r="7" fill="#059669" filter="drop-shadow(0 0 10px #10B981)"/>
    <circle cx="1150" cy="240" r="7" fill="#059669" filter="drop-shadow(0 0 10px #10B981)"/>
    <circle cx="1000" cy="380" r="6" fill="#34D399"/>
    <circle cx="150" cy="120" r="4" fill="#6EE7B7"/>
    <circle cx="1320" cy="150" r="4" fill="#6EE7B7"/>
  </g>

  <!-- Decorative Circuit Ring -->
  <circle cx="720" cy="280" r="80" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="720" cy="280" r="140" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
</svg>
